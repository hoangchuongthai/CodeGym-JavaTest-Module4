<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lỗi hệ thống</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="glass-card text-center p-5">
                    <div class="empty-icon mb-3">⚠️</div>
                    <h1 class="display-title h3 mb-3" th:text="${errorTitle}">Đã có lỗi xảy ra</h1>
                    <p class="text-muted mb-4" th:text="${errorMessage}">Vui lòng thử lại sau.</p>
                    <a href="/promotions" class="btn btn-primary btn-lg px-4">Quay lại danh sách</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
